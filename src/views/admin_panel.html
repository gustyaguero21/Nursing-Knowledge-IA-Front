<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing Knowledge AI - Administración de usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {
                colors: {
                    navy: { 800: '#002B66', 900: '#001A40', 950: '#000F26' },
                    tealmed: { 400: '#00A8CC', 500: '#0080A7', 600: '#006685' }
                },
                fontFamily: { sans: ['Montserrat', 'sans-serif'] }
            } }
        }
    </script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,.05); }
        .dark ::-webkit-scrollbar-track { background: rgba(255,255,255,.05); }
        ::-webkit-scrollbar-thumb { background: #00A8CC; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #0080A7; }
        button:focus-visible, a:focus-visible { outline: 2px solid #00A8CC; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-navy-950 text-slate-800 dark:text-slate-100 flex flex-col font-sans transition-colors duration-200 selection:bg-tealmed-400 selection:text-white">

    <!-- Encabezado -->
    <header class="bg-navy-900 border-b border-navy-800 text-white sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-[52px] h-[52px] bg-white rounded-[10px] flex items-center justify-center shrink-0 overflow-hidden">
                    <img src="/src/assets/applogo.png" alt="Logo de Nursing Knowledge AI" class="w-full h-full object-contain" width="52" height="52">
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-extrabold text-lg sm:text-xl tracking-tight text-white uppercase">NURSING <span class="text-tealmed-400">KNOWLEDGE AI</span></span>
                        <span class="bg-tealmed-400/20 text-tealmed-400 text-[10px] px-2 py-0.5 rounded-full font-bold border border-tealmed-400/30">ADMIN</span>
                    </div>
                    <p class="text-[9px] sm:text-[10px] tracking-widest text-slate-300 font-bold uppercase">CONOCIMIENTO • EVIDENCIA • CUIDADO</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openForm()" class="flex items-center space-x-2 bg-tealmed-400 hover:bg-tealmed-500 text-navy-950 font-extrabold text-xs px-3.5 py-2.5 rounded-xl transition-all shadow-md hover:shadow-tealmed-400/20" aria-label="Crear registro nuevo">
                    <i class="fa-solid fa-user-plus"></i>
                    <span id="newBtnLabel" class="hidden sm:inline">Nuevo paciente</span>
                </button>
                <button onclick="document.documentElement.classList.toggle('dark')" class="p-2.5 rounded-xl bg-navy-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors border border-white/5" title="Cambiar tema" aria-label="Cambiar tema">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>
                <button onclick="logout()" class="flex items-center gap-2 p-2.5 rounded-xl bg-navy-800 hover:bg-red-600 text-slate-300 hover:text-white transition-colors border border-white/5 text-xs font-bold" title="Cerrar sesión" aria-label="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden sm:inline">Cerrar sesión</span>
                </button>
                <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="md:hidden p-2.5 rounded-xl bg-navy-800 text-slate-200" aria-label="Abrir menú">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-20 w-72 bg-white dark:bg-navy-900 border-r border-slate-200 dark:border-navy-800 transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out flex flex-col pt-20 md:pt-0">
            <div class="flex-1 overflow-y-auto p-4 space-y-3">
                <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-1">GESTIÓN DE USUARIOS</h2>
                <nav id="roleNav" class="space-y-2" aria-label="Tipos de usuario"></nav>
            </div>
            <div class="p-3 border-t border-slate-200 dark:border-navy-800 bg-slate-50 dark:bg-navy-950/50 flex items-center justify-between text-xs font-semibold text-slate-500">
                <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    Sistema operativo
                </span>
                <i class="fa-solid fa-shield-halved text-slate-400" title="Acceso restringido a administradores"></i>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 lg:p-6 space-y-6 bg-slate-100 dark:bg-navy-950">
            <!-- Tarjeta de sección -->
            <div id="sectionCard" class="bg-white dark:bg-navy-900 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-navy-800"></div>

            <!-- Listado -->
            <div class="bg-white dark:bg-navy-900 rounded-2xl shadow-sm border border-slate-200 dark:border-navy-800 overflow-hidden">
                <div class="p-4 border-b border-slate-200 dark:border-navy-800 bg-slate-50 dark:bg-navy-950/40 flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input id="search" type="search" oninput="state.q=this.value;renderTable()" class="w-full text-xs p-2.5 pl-9 rounded-xl border border-slate-200 dark:border-navy-800 bg-white dark:bg-navy-950 focus:ring-2 focus:ring-tealmed-400 focus:outline-none font-medium" placeholder="Buscar por nombre, correo, documento..." aria-label="Buscar">
                    </div>
                    <select id="statusFilter" onchange="state.st=this.value;renderTable()" class="text-xs p-2.5 rounded-xl border border-slate-200 dark:border-navy-800 bg-white dark:bg-navy-950 focus:ring-2 focus:ring-tealmed-400 focus:outline-none font-bold" aria-label="Filtrar por estado"></select>
                </div>
                <div id="tableWrap" class="overflow-x-auto"></div>
            </div>
        </main>
    </div>

    <!-- Modal crear / editar -->
    <div id="formModal" class="fixed inset-0 bg-navy-950/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4" role="dialog" aria-modal="true" aria-labelledby="formTitle">
        <div class="bg-white dark:bg-navy-900 rounded-2xl w-full max-w-lg max-h-full overflow-y-auto p-6 shadow-2xl border border-slate-200 dark:border-navy-800 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-navy-800 pb-3">
                <h3 class="font-extrabold text-base flex items-center gap-2">
                    <i id="formIcon" class="fa-solid fa-user-plus text-tealmed-400"></i>
                    <span id="formTitle"></span>
                </h3>
                <button onclick="closeForm()" class="text-slate-400 hover:text-slate-600" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="recordForm" onsubmit="submitForm(event)" class="space-y-3 text-xs font-semibold">
                <div id="formFields" class="grid grid-cols-2 gap-3"></div>
                <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" onclick="closeForm()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-navy-800 text-slate-700 dark:text-slate-300 font-bold">Cancelar</button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-tealmed-400 text-navy-950 font-black hover:bg-tealmed-500">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toasts" class="fixed bottom-4 right-4 z-[60] space-y-2" role="status" aria-live="polite"></div>

    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const INP = 'w-full p-2.5 rounded-xl border border-slate-200 dark:border-navy-800 bg-slate-50 dark:bg-navy-950 focus:ring-2 focus:ring-tealmed-400 focus:outline-none font-medium';

        // ---- Configuración por tipo de usuario ----
        const ROLES = {
            patients: {
                label: 'Pacientes', one: 'paciente', icon: 'fa-bed-pulse', desc: 'Fichas de ingreso, habitación y equipo asignado.',
                st: ['Internado', 'De alta'], sub: 'doc',
                cols: [['room', 'Habitación'], ['dx', 'Diagnóstico'], ['doctor', 'Médico'], ['nurse', 'Enfermero/a']],
                fields: [
                    { k: 'name', l: 'Nombre completo', req: 1, w: 2, ph: 'Ej: Roberto Fernández' },
                    { k: 'doc', l: 'Documento', req: 1, ph: 'Ej: 30.123.456' },
                    { k: 'age', l: 'Edad', t: 'number', req: 1, ph: 'Ej: 58' },
                    { k: 'room', l: 'Habitación / cama', req: 1, ph: 'Ej: Hab 305' },
                    { k: 'dx', l: 'Diagnóstico principal', req: 1, ph: 'Ej: Apendectomía' },
                    { k: 'doctor', l: 'Médico a cargo', t: 'select', o: () => opts('doctors', 'Sin asignar') },
                    { k: 'nurse', l: 'Enfermero/a asignado/a', t: 'select', o: () => opts('nurses', 'Sin asignar') }
                ]
            },
            nurses: {
                label: 'Enfermeros', one: 'enfermero/a', icon: 'fa-user-nurse', desc: 'Personal de enfermería, turnos y unidades.',
                st: ['Activo', 'Inactivo'], sub: 'email',
                cols: [['lic', 'Matrícula'], ['unit', 'Unidad'], ['shift', 'Turno']],
                fields: [
                    { k: 'name', l: 'Nombre completo', req: 1, w: 2, ph: 'Ej: Lucía Romero' },
                    { k: 'email', l: 'Correo', t: 'email', req: 1, w: 2, ph: 'nombre@hospital.org' },
                    { k: 'lic', l: 'Matrícula', req: 1, ph: 'Ej: EN-4521' },
                    { k: 'unit', l: 'Unidad', req: 1, ph: 'Ej: Traumatología' },
                    { k: 'shift', l: 'Turno', t: 'select', o: () => ['Mañana', 'Tarde', 'Noche'] }
                ]
            },
            doctors: {
                label: 'Médicos', one: 'médico/a', icon: 'fa-user-doctor', desc: 'Profesionales médicos y sus especialidades.',
                st: ['Activo', 'Inactivo'], sub: 'email',
                cols: [['lic', 'Matrícula'], ['spec', 'Especialidad']],
                fields: [
                    { k: 'name', l: 'Nombre completo', req: 1, w: 2, ph: 'Ej: Dr. Martín Acosta' },
                    { k: 'email', l: 'Correo', t: 'email', req: 1, w: 2, ph: 'nombre@hospital.org' },
                    { k: 'lic', l: 'Matrícula', req: 1, ph: 'Ej: MP-18830' },
                    { k: 'spec', l: 'Especialidad', req: 1, ph: 'Ej: Traumatología' }
                ]
            },
            admins: {
                label: 'Administradores', one: 'administrador/a', icon: 'fa-user-shield', desc: 'Cuentas con acceso al panel de gestión.',
                st: ['Activo', 'Inactivo'], sub: 'email',
                cols: [['level', 'Nivel de acceso']],
                fields: [
                    { k: 'name', l: 'Nombre completo', req: 1, w: 2, ph: 'Ej: Carla Ibáñez' },
                    { k: 'email', l: 'Correo', t: 'email', req: 1, w: 2, ph: 'nombre@hospital.org' },
                    { k: 'level', l: 'Nivel de acceso', t: 'select', o: () => ['Total', 'Gestión de usuarios', 'Solo lectura'] }
                ]
            }
        };

        const seed = () => ({
            patients: [
                { id: 'p1', name: 'Juan Pérez', doc: '18.220.451', age: 62, room: 'Hab 302', dx: 'Postoperatorio reemplazo de cadera', doctor: 'd1', nurse: 'n1', active: true },
                { id: 'p2', name: 'María Gómez', doc: '22.905.118', age: 54, room: 'Hab 108', dx: 'Diabetes tipo 2 y control glucémico', doctor: 'd2', nurse: 'n2', active: true },
                { id: 'p3', name: 'Ernesto Villalba', doc: '14.376.002', age: 71, room: 'Hab 214', dx: 'Neumonía adquirida en comunidad', doctor: 'd2', nurse: 'n1', active: false }
            ],
            nurses: [
                { id: 'n1', name: 'Lucía Romero', email: 'lromero@hospital.org', lic: 'EN-4521', unit: 'Traumatología', shift: 'Mañana', active: true },
                { id: 'n2', name: 'Diego Sosa', email: 'dsosa@hospital.org', lic: 'EN-3980', unit: 'Clínica médica', shift: 'Noche', active: true }
            ],
            doctors: [
                { id: 'd1', name: 'Dr. Martín Acosta', email: 'macosta@hospital.org', lic: 'MP-18830', spec: 'Traumatología', active: true },
                { id: 'd2', name: 'Dra. Paula Ledesma', email: 'pledesma@hospital.org', lic: 'MP-20417', spec: 'Clínica médica', active: true }
            ],
            admins: [
                { id: 'a1', name: 'Carla Ibáñez', email: 'cibanez@hospital.org', level: 'Total', active: true },
                { id: 'a2', name: 'Tomás Herrera', email: 'therrera@hospital.org', level: 'Solo lectura', active: false }
            ]
        });

        // ---- Estado y persistencia (localStorage con respaldo en memoria) ----
        const KEY = 'nk_admin_v1';
        let db = null;
        try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
        if (!db) db = seed();
        const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
        const state = { role: 'patients', q: '', st: 'all', editing: null };

        const opts = (role, empty) => [{ v: '', l: empty }, ...db[role].filter(r => r.active).map(r => ({ v: r.id, l: r.name }))];
        const nameOf = (role, id) => (db[role].find(r => r.id === id) || {}).name || '';
        const cell = (r, k) => k === 'doctor' ? nameOf('doctors', r.doctor) : k === 'nurse' ? nameOf('nurses', r.nurse) : r[k];

        // ---- Renderizado ----
        function renderNav() {
            $('roleNav').innerHTML = Object.entries(ROLES).map(([key, R]) => {
                const on = key === state.role;
                return `<button onclick="setRole('${key}')" aria-current="${on}" class="w-full text-left p-3 rounded-xl border transition-all flex items-center gap-3 ${on ? 'bg-tealmed-400/10 border-tealmed-400 dark:bg-tealmed-400/20' : 'bg-slate-50 dark:bg-navy-800/60 border-slate-200/60 dark:border-navy-800 hover:border-tealmed-400'}">
                    <i class="fa-solid ${R.icon} w-5 text-center ${on ? 'text-tealmed-400' : 'text-slate-400'}"></i>
                    <span class="flex-1 font-bold text-xs ${on ? 'text-tealmed-400' : ''}">${R.label}</span>
                    <span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-slate-200 dark:bg-navy-950 text-slate-600 dark:text-slate-300">${db[key].length}</span>
                </button>`;
            }).join('');
        }

        function renderSection() {
            const R = ROLES[state.role], list = db[state.role];
            const act = list.filter(r => r.active).length;
            $('newBtnLabel').textContent = 'Nuevo ' + R.one;
            $('sectionCard').innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-2xl bg-tealmed-400/10 text-tealmed-400 flex items-center justify-center text-xl border border-tealmed-400/20"><i class="fa-solid ${R.icon}"></i></div>
                        <div>
                            <h2 class="font-black text-lg">${R.label}</h2>
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${R.desc}</p>
                        </div>
                    </div>
                    <div class="flex gap-2 text-xs font-bold">
                        <span class="bg-slate-100 dark:bg-navy-800 px-3 py-1.5 rounded-xl text-slate-600 dark:text-slate-300">${list.length} en total</span>
                        <span class="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-3 py-1.5 rounded-xl">${act} ${R.st[0].toLowerCase()}${act === 1 ? '' : 's'}</span>
                        <span class="bg-slate-100 dark:bg-navy-800 px-3 py-1.5 rounded-xl text-slate-500">${list.length - act} ${R.st[1].toLowerCase()}${list.length - act === 1 ? '' : 's'}</span>
                    </div>
                </div>`;
            $('statusFilter').innerHTML = `<option value="all">Todos los estados</option><option value="1">${R.st[0]}</option><option value="0">${R.st[1]}</option>`;
            $('statusFilter').value = state.st;
        }

        function renderTable() {
            const R = ROLES[state.role], q = state.q.trim().toLowerCase();
            const rows = db[state.role].filter(r => {
                if (state.st !== 'all' && String(+r.active) !== state.st) return false;
                if (!q) return true;
                return [r.name, r[R.sub], ...R.cols.map(c => cell(r, c[0]))].join(' ').toLowerCase().includes(q);
            });
            if (!rows.length) {
                $('tableWrap').innerHTML = `<div class="p-10 text-center text-xs font-medium text-slate-500">
                    <i class="fa-solid ${R.icon} text-2xl text-tealmed-400 mb-3"></i>
                    <p class="font-bold text-sm text-slate-700 dark:text-slate-200 mb-1">No hay ${R.label.toLowerCase()} para mostrar</p>
                    <p class="mb-4">Cambia la búsqueda o el filtro, o crea un registro nuevo.</p>
                    <button onclick="openForm()" class="bg-tealmed-400 hover:bg-tealmed-500 text-navy-950 font-extrabold px-3.5 py-2 rounded-xl">Nuevo ${R.one}</button></div>`;
                return;
            }
            $('tableWrap').innerHTML = `<table class="w-full text-xs min-w-[640px]">
                <thead class="bg-slate-50 dark:bg-navy-950/40"><tr class="text-left text-[11px] font-black text-slate-400 uppercase tracking-wider">
                    <th class="px-4 py-3">Nombre</th>${R.cols.map(c => `<th class="px-4 py-3">${c[1]}</th>`).join('')}<th class="px-4 py-3">Estado</th><th class="px-4 py-3 text-right">Acciones</th>
                </tr></thead>
                <tbody>${rows.map(r => `
                    <tr class="border-t border-slate-100 dark:border-navy-800 hover:bg-slate-50 dark:hover:bg-navy-800/40 transition-colors">
                        <td class="px-4 py-3"><div class="flex items-center gap-3">
                            <div class="w-9 h-9 shrink-0 rounded-xl bg-tealmed-400/10 text-tealmed-400 flex items-center justify-center font-black border border-tealmed-400/20">${esc(r.name.charAt(0).toUpperCase())}</div>
                            <div class="min-w-0"><p class="font-bold">${esc(r.name)}${state.role === 'patients' ? ` <span class="ml-1 text-[10px] bg-slate-100 dark:bg-navy-800 px-2 py-0.5 rounded-full font-bold text-slate-600 dark:text-slate-300">${esc(r.age)} años</span>` : ''}</p>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate">${esc(r[R.sub])}</p></div></div></td>
                        ${R.cols.map(c => `<td class="px-4 py-3 font-medium">${esc(cell(r, c[0])) || '<span class="text-slate-400">—</span>'}</td>`).join('')}
                        <td class="px-4 py-3"><span class="text-[10px] font-extrabold px-2.5 py-1 rounded-full ${r.active ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400' : 'bg-slate-200 dark:bg-navy-950 text-slate-500'}">${R.st[r.active ? 0 : 1]}</span></td>
                        <td class="px-4 py-3"><div class="flex justify-end gap-1.5">
                            <button onclick="openForm('${r.id}')" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-navy-800 hover:bg-tealmed-400/20 text-slate-600 dark:text-slate-300 hover:text-tealmed-400 transition" title="Editar" aria-label="Editar ${esc(r.name)}"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="toggleActive('${r.id}')" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-navy-800 hover:bg-amber-400/20 text-slate-600 dark:text-slate-300 hover:text-amber-500 transition" title="${r.active ? 'Marcar como ' + R.st[1].toLowerCase() : 'Marcar como ' + R.st[0].toLowerCase()}" aria-label="Cambiar estado de ${esc(r.name)}"><i class="fa-solid fa-power-off"></i></button>
                            <button onclick="askDelete('${r.id}')" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-navy-800 hover:bg-red-500/20 text-slate-600 dark:text-slate-300 hover:text-red-500 transition" title="Eliminar" aria-label="Eliminar ${esc(r.name)}"><i class="fa-solid fa-trash"></i></button>
                        </div></td>
                    </tr>`).join('')}
                </tbody></table>`;
        }

        const renderAll = () => { renderNav(); renderSection(); renderTable(); };

        function setRole(key) {
            state.role = key; state.q = ''; state.st = 'all';
            $('search').value = '';
            $('sidebar').classList.add('-translate-x-full');
            renderAll();
        }

        // ---- Formulario ----
        function openForm(id) {
            const R = ROLES[state.role];
            const rec = id ? db[state.role].find(r => r.id === id) : null;
            state.editing = id || null;
            $('formTitle').textContent = (rec ? 'Editar ' : 'Nuevo ') + R.one;
            $('formIcon').className = `fa-solid ${rec ? 'fa-pen' : 'fa-user-plus'} text-tealmed-400`;
            const field = f => {
                const v = rec ? rec[f.k] : '';
                const base = `id="f_${f.k}" name="${f.k}" class="${INP}"`;
                let input;
                if (f.t === 'select') {
                    input = `<select ${base}>${f.o().map(o => {
                        const ov = typeof o === 'string' ? o : o.v, ol = typeof o === 'string' ? o : o.l;
                        return `<option value="${esc(ov)}" ${ov === v ? 'selected' : ''}>${esc(ol)}</option>`;
                    }).join('')}</select>`;
                } else {
                    input = `<input ${base} type="${f.t || 'text'}" ${f.req ? 'required' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
                }
                return `<div class="${f.w === 2 ? 'col-span-2' : 'col-span-2 sm:col-span-1'}"><label for="f_${f.k}" class="block mb-1">${f.l}</label>${input}</div>`;
            };
            const status = `<div class="col-span-2"><label for="f_active" class="block mb-1">Estado</label>
                <select id="f_active" class="${INP}"><option value="1" ${!rec || rec.active ? 'selected' : ''}>${R.st[0]}</option><option value="0" ${rec && !rec.active ? 'selected' : ''}>${R.st[1]}</option></select></div>`;
            $('formFields').innerHTML = R.fields.map(field).join('') + status;
            $('formModal').classList.remove('hidden');
            $('formFields').querySelector('input,select').focus();
        }
        const closeForm = () => $('formModal').classList.add('hidden');

        function submitForm(e) {
            e.preventDefault();
            const R = ROLES[state.role], data = {};
            R.fields.forEach(f => { data[f.k] = $('f_' + f.k).value.trim(); });
            data.active = $('f_active').value === '1';
            if (data.age !== undefined) data.age = parseInt(data.age, 10);
            if (state.editing) {
                Object.assign(db[state.role].find(r => r.id === state.editing), data);
                toast(`${data.name} se actualizó correctamente.`);
            } else {
                db[state.role].unshift({ id: state.role[0] + Date.now(), ...data });
                toast(`${data.name} se creó correctamente.`);
            }
            persist(); closeForm(); renderAll();
        }

        // ---- Acciones ----
        function toggleActive(id) {
            const r = db[state.role].find(x => x.id === id), R = ROLES[state.role];
            r.active = !r.active;
            persist(); renderAll();
            toast(`${r.name} ahora figura como ${R.st[r.active ? 0 : 1].toLowerCase()}.`);
        }

        function askDelete(id) {
            const r = db[state.role].find(x => x.id === id);
            confirmDialog({
                icon: 'fa-trash', title: `¿Eliminar a ${r.name}?`,
                text: 'Esta acción no se puede deshacer. Si solo quieres quitarle el acceso, cambia su estado en lugar de eliminarlo.',
                ok: 'Eliminar',
                onOk: () => {
                    db[state.role] = db[state.role].filter(x => x.id !== id);
                    // Limpia asignaciones de pacientes que apuntaban a este profesional
                    if (state.role === 'doctors') db.patients.forEach(p => { if (p.doctor === id) p.doctor = ''; });
                    if (state.role === 'nurses') db.patients.forEach(p => { if (p.nurse === id) p.nurse = ''; });
                    persist(); renderAll(); toast(`${r.name} se eliminó.`);
                }
            });
        }

        function confirmDialog({ icon, title, text, ok, onOk }) {
            if ($('confirmDialog')) return;
            const prev = document.activeElement;
            const d = document.createElement('dialog');
            d.id = 'confirmDialog';
            d.className = 'w-[calc(100%-2rem)] max-w-md m-auto p-6 rounded-2xl bg-white dark:bg-navy-900 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-navy-800 shadow-2xl backdrop:bg-navy-950/70 backdrop:backdrop-blur-sm';
            d.setAttribute('aria-labelledby', 'cdTitle');
            d.innerHTML = `
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 rounded-xl bg-red-500/10 text-red-500 flex items-center justify-center"><i class="fa-solid ${icon}"></i></div>
                    <h3 id="cdTitle" class="font-extrabold text-base">${esc(title)}</h3>
                </div>
                <p class="text-xs font-medium text-slate-500 dark:text-slate-300 leading-relaxed">${esc(text)}</p>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" data-cancel autofocus class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 text-xs font-bold hover:bg-slate-200 dark:hover:bg-navy-950 transition">Cancelar</button>
                    <button type="button" data-ok class="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-extrabold transition">${esc(ok)}</button>
                </div>`;
            d.querySelector('[data-cancel]').onclick = () => d.close();
            d.querySelector('[data-ok]').onclick = () => { d.close(); onOk(); };
            d.addEventListener('close', () => { d.remove(); prev?.focus(); }, { once: true });
            document.body.appendChild(d);
            d.showModal();
        }

        function logout() {
            confirmDialog({
                icon: 'fa-right-from-bracket', title: '¿Cerrar sesión?',
                text: 'Los cambios no guardados se perderán. ¿Deseas continuar?', ok: 'Cerrar sesión',
                onOk: () => window.location.replace('login.html') // Ajustar la ruta si es necesario
            });
        }

        function toast(msg) {
            const t = document.createElement('div');
            t.className = 'bg-navy-900 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-lg border border-tealmed-400/30 flex items-center gap-2';
            t.innerHTML = `<i class="fa-solid fa-circle-check text-tealmed-400"></i><span>${esc(msg)}</span>`;
            $('toasts').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });
        renderAll();
    </script>
</body>
</html>
